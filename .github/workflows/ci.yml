name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  chm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check:lockfile
      - name: Install isolated CHM test dependencies
        run: python -m pip install --index-url https://pypi.org/simple -r server/document-conversion/python/chm/requirements.txt
      - name: Offline CHM archive and Markdown regression
        run: python tests/document-chm-test.py

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check lockfile registry
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      # 协议双端手工同步校验（server/protocol.ts ↔ web/src/types.ts）
      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 设计令牌检查与纯函数单测（零 token）
      - name: Design tokens and unit tests
        run: npm test

      # 零 token 协议冒烟（每个测试自起隔离 server：独立端口 + 临时 data-dir）
      - name: Protocol smoke tests
        run: node tests/run-smoke.mjs

  node-workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm run check:lockfile
      - run: npm ci
      - run: npm run build:server
      - run: node tests/node-workbench-test.mjs
