# pi-web-ui Electron 桌面版发布 CI
# 在 tag（v*）推送时触发：三平台各自构建安装包并上传到 GitHub Releases
# （electron-builder.yml 里的 publish: provider: github 配置生效）。
# 也支持手动触发（workflow_dispatch），比如某个平台构建失败要单独重跑。
#
# 当前不签名（Mac / Windows 都没配证书）：
#   - macOS：用户首次打开会被 Gatekeeper 拦「无法验证开发者」，右键选
#     「打开」即可跳过，不影响正常使用。
#   - Windows：SmartScreen 可能会有一次「未知发布者」提示，点「仍要运行」即可。
# 以后要签名的话，mac 端加 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID / CSC_LINK / CSC_KEY_PASSWORD 几个 repo secrets，
# electron-builder 会自动识别并签名+公证，不需要改这个 workflow。
#
# Reference: https://www.electron.build/configuration/publish

name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        type: choice
        options:
          - all
          - mac
          - win
          - linux
        default: all

permissions:
  contents: write

jobs:
  verify-code-intelligence:
    uses: ./.github/workflows/ci.yml

  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release for tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --title "$RELEASE_TAG" --draft)
            if [ -f ".github/release-notes/$RELEASE_TAG.md" ]; then
              args+=(--notes-file ".github/release-notes/$RELEASE_TAG.md")
            else
              args+=(--notes "Desktop release $version")
            fi
            if [[ "$version" == *-* ]]; then args+=(--prerelease --latest=false); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi

  build-mac:
    needs: [prepare-release, verify-code-intelligence]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mac' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install --upgrade setuptools --break-system-packages

      - name: Set isolated native toolchain directory
        shell: bash
        run: echo "PI_NATIVE_TEST_DATA=$RUNNER_TEMP/pi-native-language-tools" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: Setup Rust standard library for LSP fixtures
        run: rustup component add rust-src

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      - name: Verify native tools and OAuth (plain Node)
        run: |
          node tests/terminal-bash-test.mjs
          node tests/native-tools-desktop-test.mjs
          node tests/provider-auth-test.mjs
          node tests/pi-one-images-test.mjs
          node tests/model-config-preservation-test.mjs
          node tests/builtin-subagents-test.mjs

      - name: Verify language services and nested Maven (plain Node)
        run: |
          node tests/code-intelligence-test.mjs
          node tests/native-code-intelligence-test.mjs --install
          node tests/maven-code-intelligence-test.mjs
        env:
          PI_NATIVE_MAVEN_PREFIX: backend

      - name: Build Electron (macOS)
        run: |
          channel=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          npx electron-builder build --mac --arm64 --publish never --config.publish.channel="$channel"

      - name: Verify packaged server, native worker and OAuth
        run: |
          app="release/mac-arm64/pi.app"
          root="$app/Contents/Resources/app"
          executable="$app/Contents/MacOS/pi"
          node tests/packaged-server-start-test.mjs "$executable" "$root"
          node tests/native-tools-desktop-test.mjs "$executable" "$root"
          ELECTRON_RUN_AS_NODE=1 "$executable" tests/provider-auth-test.mjs "$PWD/$root"
          ELECTRON_RUN_AS_NODE=1 "$executable" tests/pi-one-images-test.mjs "$PWD/$root"
          ELECTRON_RUN_AS_NODE=1 "$executable" tests/builtin-subagents-test.mjs "$PWD/$executable" "$PWD/$root"
          node tests/native-code-desktop-test.mjs "$executable" "$root"
          codesign --verify --deep --strict "$app"

      - name: Upload verified macOS packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          channel=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          gh release upload "$tag" release/*.dmg release/*.zip release/*.blockmap "release/$channel-mac.yml" --clobber

  build-win:
    needs: [prepare-release, verify-code-intelligence]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'win' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install --upgrade setuptools

      - name: Set isolated native toolchain directory
        shell: bash
        run: echo "PI_NATIVE_TEST_DATA=$RUNNER_TEMP/pi-native-language-tools" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: Setup Rust standard library for LSP fixtures
        run: rustup component add rust-src

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      # 跟 verify-windows-desktop.yml 一样，真机跑一遍终端冒烟测试再打包，
      # 出了问题 release 阶段就能发现，不用等用户下载了才报告 bug。
      #
      # 终端读写失败必须阻断发布；AttachConsole 清理竞态由
      # server/patch-node-pty.ts 处理，不能把整条冒烟测试标成可忽略。
      - name: Terminal smoke test (plain Node)
        run: node tests/terminal-smoke-test.mjs

      - name: Verify native tools and OAuth (plain Node)
        run: |
          node tests/native-tools-desktop-test.mjs
          node tests/provider-auth-test.mjs
          node tests/pi-one-images-test.mjs
          node tests/model-config-preservation-test.mjs
          node tests/builtin-subagents-test.mjs

      - name: Install browser for toolbar regression
        run: npx playwright-core install chromium

      - name: Verify desktop toolbar layout on Windows
        run: node tests/desktop-toolbar-test.mjs

      - name: Verify language services and nested Maven (plain Node)
        run: |
          node tests/code-intelligence-test.mjs
          node tests/native-code-intelligence-test.mjs --install
          node tests/maven-code-intelligence-test.mjs
        env:
          PI_NATIVE_MAVEN_PREFIX: backend

      - name: Build Electron (Windows)
        shell: bash
        run: |
          channel=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          npx electron-builder build --win --x64 --publish never --config.publish.channel="$channel"

      - name: Verify packaged server and portable relaunch
        shell: pwsh
        run: |
          node tests/packaged-server-start-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged server cannot start" }
          node tests/native-tools-desktop-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged native tools failed" }
          $env:ELECTRON_RUN_AS_NODE = "1"
          & ./release/win-unpacked/pi.exe tests/provider-auth-test.mjs "$PWD/release/win-unpacked/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Packaged OAuth failed" }
          & ./release/win-unpacked/pi.exe tests/pi-one-images-test.mjs "$PWD/release/win-unpacked/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Packaged images failed" }
          & ./release/win-unpacked/pi.exe tests/builtin-subagents-test.mjs "$PWD/release/win-unpacked/pi.exe" "$PWD/release/win-unpacked/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Packaged built-in subagents failed" }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          node tests/native-code-desktop-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged language services failed" }
          $portable = Get-ChildItem release/*win-x64.exe | Select-Object -First 1
          ./tests/portable-relaunch-test.ps1 -PortableExe $portable.FullName

      - name: Publish verified Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag
          if ($LASTEXITCODE -ne 0) { throw "Release draft is missing" }
          $channel = if ($version.Contains('-')) { $version.Split('-')[1].Split('.')[0] } else { 'latest' }
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip', '.blockmap' -or $_.Name -eq "$channel.yml" }
          if ($assets.Count -lt 5) { throw "Windows release assets are incomplete" }
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }

  build-linux:
    needs: [prepare-release, verify-code-intelligence]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system deps (node-gyp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-setuptools 2>/dev/null || true

      - name: Set isolated native toolchain directory
        shell: bash
        run: echo "PI_NATIVE_TEST_DATA=$RUNNER_TEMP/pi-native-language-tools" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: Setup Rust standard library for LSP fixtures
        run: rustup component add rust-src

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      - name: Verify native tools and OAuth (plain Node)
        run: |
          node tests/terminal-bash-test.mjs
          node tests/native-tools-desktop-test.mjs
          node tests/provider-auth-test.mjs
          node tests/pi-one-images-test.mjs
          node tests/model-config-preservation-test.mjs
          node tests/builtin-subagents-test.mjs

      - name: Verify language services and nested Maven (plain Node)
        run: |
          node tests/code-intelligence-test.mjs
          node tests/native-code-intelligence-test.mjs --install
          node tests/maven-code-intelligence-test.mjs
        env:
          PI_NATIVE_MAVEN_PREFIX: backend

      - name: Build Electron (Linux)
        run: |
          channel=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          npx electron-builder build --linux --x64 --publish never --config.publish.channel="$channel"

      - name: Verify packaged server, native worker and OAuth
        run: |
          root="$PWD/release/linux-unpacked/resources/app"
          executable="$PWD/release/linux-unpacked/pi"
          node tests/packaged-server-start-test.mjs "$executable" "$root"
          node tests/native-tools-desktop-test.mjs "$executable" "$root"
          ELECTRON_RUN_AS_NODE=1 "$executable" tests/provider-auth-test.mjs "$root"
          ELECTRON_RUN_AS_NODE=1 "$executable" tests/pi-one-images-test.mjs "$root"
          ELECTRON_RUN_AS_NODE=1 "$executable" tests/builtin-subagents-test.mjs "$executable" "$root"
          node tests/native-code-desktop-test.mjs "$executable" "$root"

      - name: Upload verified Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          channel=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          gh release upload "$tag" release/*.AppImage release/*.deb "release/$channel-linux.yml" --clobber

  publish-release:
    needs: [build-mac, build-win, build-linux]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify attachments and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > /tmp/release-assets.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json')).version;
          const channel = version.split('-')[1]?.split('.')[0] || 'latest';
          const names = new Set(JSON.parse(readFileSync('/tmp/release-assets.json')).assets.map(asset => asset.name));
          for (const name of [`pi-${version}-mac-arm64.dmg`, `pi-${version}-mac-arm64.zip`, `pi-${version}-setup-x64.exe`, `pi-${version}-win-x64.exe`, `pi-${version}-win-x64.zip`, `pi-${version}-linux-x86_64.AppImage`, `pi-${version}-linux-amd64.deb`, `${channel}-mac.yml`, `${channel}.yml`, `${channel}-linux.yml`]) {
            if (!names.has(name)) throw new Error(`Missing release attachment: ${name}`);
          }
          NODE
          gh release edit "$RELEASE_TAG" --draft=false
