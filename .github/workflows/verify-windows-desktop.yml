# 一次性验证用：在真机 Windows runner 上确认 Electron 桌面版能正常构建 + node-pty
# 终端功能在 Windows 上真的能跑（本地在 mac/Linux 沙箱里只能跳过 rebuild 交叉出 zip，
# 没法验证这一步）。手动触发（Actions 页 "Run workflow"），验证完可以把这个文件删掉，
# 不是常驻 CI，不影响 ci.yml。
name: Verify Windows desktop build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release to diagnose (blank builds the checkout)"
        type: string
        default: ""

jobs:
  verify:
    if: ${{ inputs.release_tag == '' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      # 先在普通 Node 下跑一遍终端冒烟测试：确认 node-pty 自带的
      # prebuilds/win32-x64/pty.node 在真机 Windows 上能正常 spawn/收发数据。
      # 终端失败需要直接阻断验证，不能用 continue-on-error 掩盖读写问题。
      - name: Terminal smoke test (plain Node)
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Terminal smoke round $_/3"
            node tests/terminal-smoke-test.mjs
            if ($LASTEXITCODE -ne 0) { throw "Terminal smoke round $_ failed" }
          }

      - name: Rebuild Electron host terminal module
        run: npm run rebuild:electron

      - name: Build Electron desktop app
        run: npm run build:electron:win -- --publish never

      - name: Verify packaged server and portable relaunch
        shell: pwsh
        run: |
          node tests/packaged-server-start-test.mjs release/win-unpacked/OMP.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged server cannot start" }
          $portable = Get-ChildItem release/*win-x64.exe | Select-Object -First 1
          ./tests/portable-relaunch-test.ps1 -PortableExe $portable.FullName

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: omp-web-ui-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  diagnose-release:
    if: ${{ inputs.release_tag != '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download published Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --pattern '*win-x64.zip' --pattern '*setup-x64.exe' --dir "$env:RUNNER_TEMP/packages"
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
      - name: Start published ZIP in a path with spaces and Chinese characters
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP/packages/*win-x64.zip" | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP/桌面测试/portable pi"
          Expand-Archive $zip.FullName $dest
          node tests/packaged-server-start-test.mjs "$dest/OMP.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Published ZIP cannot start" }
      - name: Install NSIS and start installed server
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP/packages/*setup-x64.exe" | Select-Object -First 1
          $dest = Join-Path $env:LOCALAPPDATA "Programs\pi-test"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', "/D=$dest") -PassThru
          if (-not $proc.WaitForExit(180000)) { throw "Installer did not exit within 180 seconds" }
          if ($proc.ExitCode -ne 0) { throw "Installer failed: $($proc.ExitCode)" }
          if (-not (Test-Path "$dest/OMP.exe")) {
            $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter OMP.exe -Recurse | Select-Object -First 1
            if (-not $installed) { throw "Installer exited without an installed OMP.exe" }
            $dest = $installed.DirectoryName
          }
          Write-Host "Installed app: $dest"
          node tests/packaged-server-start-test.mjs "$dest/OMP.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Installed server cannot start" }

  diagnose-portable:
    if: ${{ inputs.release_tag != '' }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download published portable EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --pattern '*win-x64.exe' --dir "$env:RUNNER_TEMP/portable-package"
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
      - name: Verify portable first launch and relaunch
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:RUNNER_TEMP/portable-package/*win-x64.exe" | Select-Object -First 1
          ./tests/portable-relaunch-test.ps1 -PortableExe $exe.FullName
