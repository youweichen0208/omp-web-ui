# One-command deploy: `docker compose up -d`
# Auto-restarts on boot when the Docker daemon starts (restart: unless-stopped).
services:
  pi-harness:
    build: .
    image: pi-harness:latest
    ports:
      # Reachable from this machine only. The agent can run shell commands in
      # the container: before exposing it to a network, set PI_WEB_TOKEN and
      # PI_WEB_ALLOW_HOSTS (see docs/deployment.md).
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      # The container must bind ALL interfaces so the port mapping works —
      # the server defaults to loopback-only for security.
      PI_WEB_HOST: "0.0.0.0"
      # Binding 0.0.0.0 disables the default loopback Host allowlist; keep it
      # so DNS rebinding pages cannot drive the agent. Add your hostnames here.
      PI_WEB_ALLOW_HOSTS: "localhost,127.0.0.1"
      # PI_WEB_TOKEN: "change-me"
    volumes:
      # pi config, auth.json, models and chat sessions (/data/pi-agent) plus
      # pi-harness state, uploads and Wiki history (/data/pi-harness).
      - pi-harness-data:/data
      # The project the agent works in (PI_WEB_CWD=/workspace):
      # - /host/path/to/project:/workspace
    restart: unless-stopped

volumes:
  pi-harness-data:
